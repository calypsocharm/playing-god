<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClawKeep · The Story</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23e8a04c'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%230e1116'/%3E%3C/svg%3E">
<style>
  :root { --bg:#0e1116; --panel:#161b24; --line:#2a3242; --ink:#d9dee8; --dim:#8a94a6; --warm:#e8a04c; --good:#6cc38a; --bad:#d9645b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:17px/1.65 Georgia, 'Times New Roman', serif; }
  header { display:flex; align-items:center; gap:14px; padding:10px 18px; border-bottom:1px solid var(--line); background:var(--panel); font-family:system-ui, sans-serif; position:sticky; top:0; z-index:2; flex-wrap:wrap; }
  header h1 { font-size:14px; letter-spacing:.1em; text-transform:uppercase; color:var(--warm); margin:0; }
  header a { color:var(--dim); text-decoration:none; font-size:13px; }
  header .spacer { flex:1; }
  header label { font-size:12px; color:var(--dim); display:flex; gap:6px; align-items:center; }
  .book { max-width: 760px; margin: 0 auto; padding: 28px 22px 80px; }
  .frontis { text-align:center; margin: 10px 0 40px; color:var(--dim); font-family:system-ui; font-size:14px; }
  .frontis h2 { font: 600 34px Georgia, serif; color:var(--ink); margin:0 0 6px; }
  .toc { columns: 2; column-gap: 24px; font-family: system-ui; font-size: 13px; margin: 0 0 40px; padding: 14px 18px; border:1px solid var(--line); border-radius:8px; }
  .toc a { display:block; color:var(--dim); text-decoration:none; padding:2px 0; }
  .toc a:hover { color:var(--warm); }
  .toc .yr { color:var(--warm); font-weight:600; margin-top:6px; break-inside: avoid; }
  .chapter { margin: 0 0 54px; }
  .chapter h3 { font: 600 26px Georgia, serif; margin: 0 0 4px; }
  .chapter .sub { font-family:system-ui; font-size:12px; color:var(--dim); margin-bottom:16px; letter-spacing:.06em; text-transform:uppercase; }
  .chapter p { margin: 0 0 14px; text-indent: 1.4em; }
  .chapter p:first-of-type { text-indent: 0; }
  .chapter p.told { color:#f0e9d6; }
  .chapter .daymark { font-family:system-ui; font-size:11px; color:var(--dim); letter-spacing:.06em; margin-right:6px; }
  blockquote { margin: 10px 0 18px 2.2em; padding-left: 12px; border-left: 2px solid var(--warm); color:#e6d9bd; font-style: italic; font-size: 15px; }
  blockquote cite { display:block; font-style: normal; font-family:system-ui; font-size:12px; color:var(--dim); margin-top:4px; }
  .gone { font-family: system-ui; font-size: 13px; color: var(--dim); border-top:1px solid var(--line); padding-top:14px; margin-top:40px; }
  .gone b { color: var(--ink); }
  .empty { color:var(--dim); font-family:system-ui; text-align:center; padding:40px; }
  mark { background: rgba(232,160,76,.25); color: inherit; }
</style>
</head>
<body>
<header>
  <h1>The History Book</h1>
  <a href="/">← the village</a>
  <a href="diaries.html">diaries</a>
  <span class="spacer"></span>
  <label><input type="checkbox" id="quotesOn" checked> voices from the diaries</label>
  <label><input type="checkbox" id="quietOn"> include quiet nights</label>
  <label>Search <input id="q" style="width:150px;background:#0a0d12;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font:13px system-ui"></label>
</header>
<div class="book" id="book"><div class="empty">Opening the book…</div></div>
<script type="module">
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let story = null;
async function load() {
  try { story = await (await fetch('/api/story')).json(); render(); }
  catch { $('book').innerHTML = '<div class="empty">The village is not answering.</div>'; }
}
// A history book: only what mattered. The frontispiece, where things stand today, the important
// things kept from all the years, the seasons worth a title, and the last days in full.
function render() {
  if (!story) return;
  const q = $('q').value.trim().toLowerCase();
  const quotesOn = $('quotesOn').checked, quietOn = $('quietOn').checked;
  const hl = (t) => q ? esc(t).replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'ig'), m => `<mark>${m}</mark>`) : esc(t);
  const yd = story.yearDays, yearOf = (d) => Math.floor((d || 0) / yd) + 1;
  const hs = story.history || {}, st = story.standing || {};
  const nights = story.chronicle || [];
  const isQuiet = (n) => (/A quiet day\. People worked/.test(n.text) || /^Nothing much\./.test(n.text)) && n.by !== 'told';
  const answered = story.goals.filter(g => g.done != null).length;
  const sec = (title, body) => body ? `<section class="chapter"><h3>${title}</h3>${body}</section>` : '';
  const li = (items) => `<p style="text-indent:0">${items.join('<br>')}</p>`;
  let html = `<div class="frontis"><h2>The Village</h2>${story.day} days · year ${yearOf(story.day)} · ${answered} of ${story.goals.length} questions answered · they call the sky <b style="color:var(--warm)">${esc(story.skyName)}</b>${story.ended ? `<br><b style="color:var(--bad)">The book is closed.</b> Day ${story.ended.day}: ${esc(story.ended.why)}.` : ''}</div>`;
  // where things stand
  const stand = [];
  for (const r of (st.recentDead || [])) stand.push(`<b>${esc(r.name)}</b> died on day ${r.day}, aged ${r.age ?? '?'}, of ${esc(r.cause || '')}${r.buried ? ', and lies at the stones' : ''}.`);
  for (const l of (st.why || [])) if (!/was \d+.*died of/.test(l)) stand.push(esc(l));
  if (st.council) stand.push(`The council: ${esc(st.council)}.`);
  if (st.card) stand.push(`The sky turned ${esc(st.card)}`);
  if (st.rival) stand.push(`${esc(st.rival[0].toUpperCase() + st.rival.slice(1))} toward the village.`);
  html += sec(`Where things stand <span class="sub" style="display:inline;margin-left:8px">day ${st.dayOfYear ?? ''} of year ${yearOf(story.day)}, ${esc(st.season || '')}</span>`, li(stand.length ? stand : ['Everyone is fed, warm and whole. Nothing hangs over the village.']));
  // the important things
  const imp = [];
  if ((hs.holidays || []).length) imp.push(`<b>Days the village keeps.</b> ${hs.holidays.map(x => `${esc(x.name)}, made by ${esc(x.by)} in year ${x.year} for ${esc(x.why || 'a reason no one wrote down')}, kept ${x.kept} time${x.kept === 1 ? '' : 's'}`).join('; ')}.`);
  if ((hs.builds || []).length) imp.push(`<b>Raised.</b> ${hs.builds.map(x => `the ${esc(x.what)}${x.day != null ? ` in year ${yearOf(x.day)}` : ''}`).join(', ')}${(hs.raised || []).length ? `; chosen by vote at the meeting house: ${hs.raised.map(x => esc(x.what)).join(', ')}` : ''}.`);
  if ((hs.answered || []).length) imp.push(`<b>Questions the village answered.</b> ${hs.answered.map(x => `${esc(x.what)} (year ${yearOf(x.day)})`).join('; ')}.`);
  if ((hs.destinies || []).length) imp.push(`<b>Destinies come to pass.</b> ${hs.destinies.map(x => `${esc(x.name)}: "${esc(x.text)}" (day ${x.day})`).join('; ')}.`);
  if ((hs.arts || []).length) imp.push(`<b>Arts of the village's own.</b> ${hs.arts.map(x => `${esc(x.name)} (${esc(x.by)})`).join(', ')}.`);
  if ((hs.threats || []).length) imp.push(`<b>What came out of the pale.</b> ${hs.threats.map(x => `${esc(x.name)} in year ${yearOf(x.day)}, met ${x.ready ? 'ready' : 'unready'}`).join('; ')}.`);
  if (hs.founded) imp.push(`<b>${esc(hs.founded.name)}</b> was founded past the edge on day ${hs.founded.day}, year ${yearOf(hs.founded.day)}.`);
  html += sec('The important things', imp.length ? li(imp) : '');
  // seasons worth a title
  const notable = (story.chapters || []).filter(c => c.title && !/^An ordinary |^Season \d+|^A (spring|summer|autumn|winter) the sky moved$/.test(c.title));
  const yds = yd / 4;
  const byIdx = new Map(); for (const n of nights) { const idx = Math.floor(n.day / yds); if (!byIdx.has(idx)) byIdx.set(idx, []); byIdx.get(idx).push(n); }
  let chapHtml = '';
  for (const ch of notable.slice(-40)) {
    let ns = (byIdx.get(ch.index) || []).filter(n => !isQuiet(n));
    if (q) ns = ns.filter(n => n.text.toLowerCase().includes(q));
    if (q && !ns.length && !ch.title.toLowerCase().includes(q)) continue;
    const firstDay = ns[0]?.day ?? ch.index * yds;
    chapHtml += `<div style="margin:0 0 22px"><h3 style="font-size:20px;margin:0">${hl(ch.title)}</h3><div class="sub">year ${yearOf(firstDay)} · ${esc(ch.season || '')}</div>${ns.slice(0, 2).map(n => `<p class="${n.by === 'told' ? 'told' : ''}"><span class="daymark">day ${n.day}</span>${hl(n.text)}</p>`).join('')}</div>`;
  }
  html += sec('Seasons worth a name', chapHtml || (q ? '' : '<p style="text-indent:0" class="sub">Nothing yet worth a title.</p>'));
  // the last days
  let recent = nights.slice(-14);
  if (!quietOn) recent = recent.filter(n => !isQuiet(n));
  if (q) recent = recent.filter(n => n.text.toLowerCase().includes(q) || (story.quotes[n.day] || []).some(x => x.text.toLowerCase().includes(q)));
  let recHtml = '';
  for (const n of recent.reverse()) {
    recHtml += `<p class="${n.by === 'told' ? 'told' : ''}"><span class="daymark">day ${n.day} · year ${yearOf(n.day)}</span>${hl(n.text)}</p>`;
    if (quotesOn) for (const qt of (story.quotes[n.day] || []).slice(0, 1)) recHtml += `<blockquote>${hl(qt.text.length > 320 ? qt.text.slice(0, 317) + '…' : qt.text)}<cite>${esc(qt.name)}, that night</cite></blockquote>`;
  }
  html += sec('The last days', recHtml || '<p style="text-indent:0" class="sub">Nothing written yet. The village writes at night.</p>');
  // gone, by year
  if ((hs.deadByYear || []).length) html += `<div class="gone">Gone: ${hs.deadByYear.map(y => `<b>year ${y.year}</b> ${y.names.map(esc).join(', ')}`).join(' · ')}</div>`;
  $('book').innerHTML = html;
}
for (const id of ['quotesOn', 'quietOn']) $(id).addEventListener('change', render);
$('q').addEventListener('input', render);
load();
setInterval(load, 60000);
</script>
</body>
</html>
